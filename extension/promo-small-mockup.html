<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 440px; height: 280px; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0a66c2 0%, #0e4fa8 50%, #7c3aed 100%);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}

/* Background decoration */
.circle1 { position: absolute; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.05); top: -60px; right: -40px; }
.circle2 { position: absolute; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,0.06); bottom: -40px; left: -30px; }

.content { position: relative; z-index: 2; display: flex; align-items: center; gap: 28px; padding: 0 32px; }

/* Left: logo + name */
.brand { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.logo { width: 64px; height: 64px; background: white; border-radius: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
.logo-in { color: #0a66c2; font-weight: 900; font-size: 32px; font-family: Georgia, serif; line-height: 1; }
.brand-name { color: white; font-size: 15px; font-weight: 800; letter-spacing: -0.3px; text-align: center; }
.brand-domain { color: rgba(255,255,255,0.7); font-size: 11px; font-weight: 500; }

/* Divider */
.divider { width: 1px; height: 120px; background: rgba(255,255,255,0.2); flex-shrink: 0; }

/* Right: tagline + features */
.right { flex: 1; }
.tagline { color: white; font-size: 18px; font-weight: 800; line-height: 1.3; margin-bottom: 14px; letter-spacing: -0.3px; }
.tagline span { color: #93c5fd; }
.features { display: flex; flex-direction: column; gap: 7px; }
.feat { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.9); font-size: 12px; font-weight: 500; }
.feat-dot { width: 18px; height: 18px; background: rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="circle1"></div>
  <div class="circle2"></div>
  <div class="content">
    <div class="brand">
      <div class="logo"><div class="logo-in">in</div></div>
      <div>
        <div class="brand-name">OutReachAI</div>
        <div class="brand-domain">.in</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="right">
      <div class="tagline">LinkedIn outreach<br>powered by <span>AI</span></div>
      <div class="features">
        <div class="feat"><div class="feat-dot">✨</div>AI-personalized openers</div>
        <div class="feat"><div class="feat-dot">⚡</div>One-click message fill</div>
        <div class="feat"><div class="feat-dot">📊</div>Dashboard sync & tracking</div>
      </div>
    </div>
  </div>
</body>
</html>
